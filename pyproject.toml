[project]
name = "telemetry-hub"
version = "0.1.0"
description = "Serial telemetry ingestion, storage and live streaming"
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5",
    "sqlalchemy>=2.0",
    "psycopg[binary]>3.1",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

